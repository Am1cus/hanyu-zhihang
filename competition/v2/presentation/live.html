<div class="pagehead" id="main">
  <div><h1>巡看仿真</h1><p class="minor page-note">龙江冰雪小镇 · 二维仿真</p></div>
  <span class="status" id="phase">正在读取</span>
</div>

<p class="notice" id="simulation-notice" role="status" hidden></p>
<button type="button" class="ghost reconnect" id="retry" hidden>重新连接</button>

<section class="surface panel" id="mission-config" aria-labelledby="prepare-title">
  <form id="mission-form">
    <div class="sectionrow">
      <h2 id="prepare-title">准备巡看</h2>
      <a class="text-action" id="open-current" href="/simulation" hidden>回到当前巡看</a>
    </div>
    <div class="fields sim-fields">
      <label class="field">场景
        <select id="preset">
          <option value="obstacle">前方受阻 · 任务调整</option>
          <option value="normal">正常巡看 · 完整过程</option>
          <option value="gust">突风增强 · 预算调整</option>
          <option value="low_budget">电量偏低 · 拒绝出发</option>
          <option value="unavailable">温度超范围 · 信息不足</option>
          <option value="blocked_return">突风过强 · 运行失败</option>
        </select>
      </label>
      <label class="field">气温
        <span class="inputbox"><input id="sim-temperature" type="number" min="-40" max="30" step="any" value="0" required><span class="unit">℃</span></span>
      </label>
      <label class="field">起始电量
        <span class="inputbox"><input id="sim-charge" type="number" min="0" max="100" step="any" value="85" required><span class="unit">%</span></span>
      </label>
    </div>
    <p class="minor" id="preset-hint"></p>
    <details class="known">
      <summary>仿真设置</summary>
      <div class="fields advanced-fields">
        <label class="field">任务安排方法
          <select id="selector">
            <option value="value_per_cost">优先选择划算的点</option>
            <option value="subset_dp">一次安排整趟</option>
            <option value="nearest_feasible">优先去近处</option>
            <option value="fixed_order">按原清单顺序</option>
          </select>
        </label>
        <label class="field">预算模式
          <select id="budget-mode">
            <option value="bounded">计入估算误差</option>
            <option value="nominal">按当前估计值</option>
          </select>
        </label>
        <label class="field">播放速度
          <span class="inputbox"><input id="speedup" type="number" min="1" max="100" step="any" value="20" required><span class="unit">倍</span></span>
        </label>
      </div>
    </details>
    <div class="actions sim-controls">
      <button type="submit" class="action" id="start" disabled>等待起飞预览</button>
      <span class="minor">开始这次巡看会暂停其他正在执行的巡看。</span>
    </div>
  </form>
</section>

<section class="surface panel active-panel" id="live-bar" aria-label="本次巡看操作" hidden>
  <div class="sectionrow">
    <div><h2 id="live-heading">本次巡看</h2><p class="minor" id="live-conditions"></p></div>
    <div class="actions">
      <button class="action" type="button" id="pause" hidden>暂停</button>
      <a class="action" id="open-record" href="/history" hidden>查看记录</a>
      <button class="ghost" type="button" id="new-run" hidden>新建巡看</button>
    </div>
  </div>
  <p class="minor" id="resume-note" hidden>继续这次巡看会暂停其他正在执行的巡看。</p>
  <div class="control-details" id="control-details" hidden>
    <details class="known" id="event-options">
      <summary>改变环境</summary>
      <div class="actions">
        <button class="ghost" type="button" id="obstacle">在前方加入禁入区</button>
        <button class="ghost" type="button" id="gust">增强东区风场</button>
      </div>
      <p class="minor" id="event-note">成功排队的变化在下一仿真步生效。</p>
    </details>
    <details class="known" id="more-options">
      <summary>更多操作</summary>
      <div class="actions">
        <button class="ghost" type="button" id="prepare-again">准备新巡看</button>
        <button class="ghost" type="button" id="cancel">结束本次</button>
        <a class="text-action" id="live-record" href="/history">打开本次记录</a>
      </div>
    </details>
  </div>
</section>

<!-- mission-detail -->

<details class="secondarycard surface" id="model-notes">
  <summary>巡看模型依据</summary>
  <div class="expl">
    <p>地图与任务为合成场景，完成一个巡看点指仿真停留结束。地图上的位置、已执行轨迹和返回标记来自本机执行器。</p>
    <p>温度容量来自 P42A 电芯 4.2 A 参考曲线，按理想 4S1P 计算，温度范围 −20 至 23 ℃。固定储备按室温参考满电能量的 20% 计。计入估算误差时，规划使用已有误差带。</p>
  </div>
</details>
