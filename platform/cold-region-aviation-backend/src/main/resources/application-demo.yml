spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${DEMO_DATABASE_PATH:./data/cold-aviation};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/init-demo.sql
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 200ms

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
